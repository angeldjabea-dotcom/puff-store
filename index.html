
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUFF STORE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #100819;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 22px 12px; }
    h1 { color: #d66bff; margin: 0; }
    p { color: #eee; }
    .poster {
      display: block;
      width: 100%;
      max-width: 650px;
      height: auto;
      margin: 0 auto 20px;
      border-radius: 12px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 340px;
      margin: 20px auto;
      padding: 0 12px;
    }
    .btn {
      display: block;
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      background: #8c24d6;
    }
    .whatsapp { background: #168b48; }
    section { padding: 20px 12px 40px; }
    footer { padding: 20px; color: #bbb; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>PUFF STORE</h1>
    <p>Bienvenue dans notre boutique</p>
  </header>

  <main>
    <img
      class="poster"
      src="a_vibrant_high_contrast_commercial_poster_flyer_s.png"
      alt="Affiche PUFF STORE"
    >

    <div class="buttons">
      <a class="btn" href="#informations">Voir les informations</a>
      <a class="btn whatsapp"
         href="https://wa.me/237692308228"
         target="_blank" rel="noopener">
        Contacter sur WhatsApp
      </a>
    </div>

    <section id="informations">
      <h2>PUFF STORE</h2>
      <p>Contact WhatsApp : +237 6 92 30 82 28</p>
      <p>Consultez les informations avant toute commande.</p>
      <p>Vente réservée aux adultes, conformément à la loi applicable.</p>
    </section>
  </main>

  <footer>PUFF STORE — Cameroun</footer>
</body>
</html>
